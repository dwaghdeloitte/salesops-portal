services:
  # ── Backend ────────────────────────────────────────────────────
  - type: web
    name: salesops-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/team_platform.db
    disk:
      name: salesops-db
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /api/health

  # ── Frontend ───────────────────────────────────────────────────
  - type: web
    name: salesops-portal
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: salesops-api
          type: web
          property: host
          transform: "https://{value}/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
